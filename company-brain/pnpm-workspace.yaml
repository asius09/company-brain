packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 gates dependency postinstall scripts behind explicit allowlists.
# esbuild/tsx need theirs to place prebuilt binaries; tailwindcss oxide is its engine.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/amazon-bedrock@5.0.97'
  - '@ai-sdk/anthropic@4.0.65'
  - '@ai-sdk/azure@4.0.82'
  - '@ai-sdk/cohere@4.0.50'
  - '@ai-sdk/deepseek@3.0.54'
  - '@ai-sdk/gateway@4.0.94'
  - '@ai-sdk/google@4.0.82'
  - '@ai-sdk/groq@4.0.50'
  - '@ai-sdk/mistral@4.0.52'
  - '@ai-sdk/openai-compatible@3.0.57'
  - '@ai-sdk/openai@4.0.78'
  - '@ai-sdk/provider-utils@5.0.49'
  - '@tanstack/query-core@5.104.0'
  - '@tanstack/react-query@5.104.0'
  - ai@7.0.116

# esbuild/tsx ship prebuilt binaries but still postinstall to place them.
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
